[project]
name = "cufel-deepagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.6.7",
    "langchain-mcp-adapters>=0.2.2",
